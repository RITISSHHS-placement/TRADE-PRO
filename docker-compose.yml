# ─────────────────────────────────────────────────────────────────────────────
# TradePro — Full Local Stack
#   postgres  → PostgreSQL 16  host:7433  (unique — avoids all common conflicts)
#   redis     → Redis 7        host:6399
#   backend   → Spring Boot 3  host:8765
#   frontend  → Nginx/React    host:4173  → http://localhost:4173
#
# Usage:
#   cp .env.example .env          # fill in secrets (one-time)
#   docker compose up --build     # first run  (builds images ~3 min)
#   docker compose up             # subsequent runs (images cached, ~10 s)
#   docker compose down -v        # stop and wipe volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tradepro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-tradeprodb}
      POSTGRES_USER:     ${POSTGRES_USER:-tradepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepro_secret}
    ports:
      - "7433:5432"   # TradePro postgres — unique port, avoids all common conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradepro} -d ${POSTGRES_DB:-tradeprodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tradepro-redis
    restart: unless-stopped
    ports:
      - "6399:6379"   # TradePro redis — unique port
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradepro-backend
    restart: unless-stopped
    ports:
      - "8765:8080"   # TradePro backend — unique port
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database — point to the postgres service by container name
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-tradeprodb}
      DB_USERNAME: ${POSTGRES_USER:-tradepro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tradepro_secret}
      # Redis — point to the redis service by container name
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      # JWT — must be at least 256-bit (32 chars)
      JWT_SECRET:  ${JWT_SECRET:-change-me-in-dot-env-at-least-32-chars-long}
      # CORS — allow the frontend container and localhost dev
      CORS_ALLOWED_ORIGINS: "http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000"
      # Cookies — false = SameSite=Lax (OK for http://localhost)
      APP_COOKIES_SECURE: "false"
      # Mail (OTP) — Gmail app password or leave blank to use console fallback
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Resend (optional — better deliverability than Gmail SMTP)
      RESEND_API_KEY:    ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@tradepro.in}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string → api.js falls back to '/backend' (relative path)
        # Nginx then proxy_pass that to http://backend:8080/api/
        VITE_API_URL: ""
    container_name: tradepro-frontend
    restart: unless-stopped
    ports:
      - "4173:80"     # TradePro frontend — unique port (http://localhost:4173)
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
