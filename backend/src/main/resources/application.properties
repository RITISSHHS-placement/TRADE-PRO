# Old configuration - use active configuration below






# ==========================
# TradePro Application Configuration
# ==========================

# --------------------------
# Application
# --------------------------
spring.application.name=tradepro-backend

# Lazy-init: only create beans when first requested (biggest cold-start speedup)
spring.main.lazy-initialization=true
# Start-up metrics
spring.lifecycle.timeout-per-shutdown-step=10s

# --------------------------
# Server
# --------------------------
server.port=8080

# --------------------------
# Database Configuration
# --------------------------
# PostgreSQL (preferred for production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/tradepro-db
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 File-based Database (persistent across restarts)
spring.datasource.url=jdbc:h2:file:./data/tradepro;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --------------------------
# JPA / Hibernate
# --------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------
# JWT
# --------------------------
jwt.secret=${JWT_SECRET:trade-pro-super-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --------------------------
# TOTP
# --------------------------
totp.issuer=TradePro

# --------------------------
# CORS
# --------------------------
# Dev: allow all localhost/127.0.0.1 origins on ANY port (Vite picks a free port:
# 3000, 3001, 5173, etc.). Browsers send Origin: http://127.0.0.1:<port> or
# http://localhost:<port> for these same-origin-via-proxy POSTs; rejecting any
# port caused register/login to 403 with "Invalid CORS request".
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# --------------------------
# Email Configuration (Resend primary, SMTP fallback)
# --------------------------
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ritissh200612@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yckdkherqltfmgrl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
# Disable auto-config test connection on startup
spring.mail.test-connection=false

# --------------------------
# OTP Configuration
# --------------------------
app.otp.expiration=300

# --------------------------
# Redis Configuration
# --------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# --------------------------
# Spring Boot Actuator
# --------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --------------------------
# Logging
# --------------------------
logging.level.root=INFO
logging.level.com.tradepro=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE