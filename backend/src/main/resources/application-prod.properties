# ==========================
# TradePro Production Configuration
# ==========================

# --------------------------
# Server
# --------------------------
server.port=${PORT:8080}

# --------------------------
# PostgreSQL Database
# --------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradepro-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --------------------------
# JPA / Hibernate
# --------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --------------------------
# JWT
# --------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --------------------------
# TOTP
# --------------------------
totp.issuer=${TOTP_ISSUER:TradePro}

# --------------------------
# CORS
# --------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --------------------------
# Mail (OTP)
# --------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ritissh200612@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.test-connection=false

# --------------------------
# OTP
# --------------------------
app.otp.expiration=300

# --------------------------
# Redis (optional — rate limiter falls back gracefully)
# --------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --------------------------
# Actuator
# --------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --------------------------
# Logging
# --------------------------
logging.level.root=INFO
logging.level.com.tradepro=INFO
logging.level.org.hibernate.SQL=WARN