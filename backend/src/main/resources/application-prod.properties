# ==========================
# TradePro Production Configuration
# ==========================

# --------------------------
# Startup Optimisation
# --------------------------
# Lazy-init: create beans on-demand → cuts cold-start from ~30s to ~8-12s
spring.main.lazy-initialization=true
# Show startup time in logs
spring.lifecycle.timeout-per-shutdown-step=10s

# --------------------------
# Server
# --------------------------
server.port=${PORT:8080}

# --------------------------
# PostgreSQL Database
# --------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradepro-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --------------------------
# JPA / Hibernate
# --------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --------------------------
# JWT
# --------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --------------------------
# TOTP
# --------------------------
totp.issuer=${TOTP_ISSUER:TradePro}

# --------------------------
# Cookies
# --------------------------
# true  = Secure + SameSite=None (required for cross-origin HTTPS in prod)
# false = no Secure flag + SameSite=Lax (dev only)
app.cookies.secure=true

# --------------------------
# CORS
# --------------------------
# localhost:5173 / 127.0.0.1 included so devs can test against the prod backend directly.
# *.vercel.app covers the main site AND Vercel preview deployments in the default
# (fallback) allowlist, so registration never 403s when the Render env var is unset.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://trade-pro-t7l6.vercel.app,https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# --------------------------
# Mail (OTP) — Resend API (primary) + SMTP (fallback)
# --------------------------
# Resend: free 100 emails/day, sign up at https://resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@tradepro.in}
# SMTP fallback (only used if Resend key is absent)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ritissh200612@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yckdkherqltfmgrl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.test-connection=false

# --------------------------
# OTP
# --------------------------
app.otp.expiration=300

# --------------------------
# Redis (optional — rate limiter falls back gracefully)
# --------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Keep-alive self-ping (prevents Render free tier cold starts)
server.self-url=${SELF_URL:https://tradepro-backend-erfj.onrender.com}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --------------------------
# Logging
# --------------------------
logging.level.root=INFO
logging.level.com.tradepro=INFO
logging.level.org.hibernate.SQL=WARN