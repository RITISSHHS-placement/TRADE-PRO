server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── /backend/* → Spring Boot API (/api/*) ───────────────────────────────
    # api.js uses BASE_URL='/backend'; Nginx rewrites it to /api/ on the way
    # to the backend container so controller paths like /api/auth/** match.
    location /backend/ {
        rewrite ^/backend/(.*) /api/$1 break;
        proxy_pass         http://tradepro-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Forward cookies (HttpOnly auth cookies need this)
        proxy_pass_header  Set-Cookie;
        proxy_connect_timeout 90s;
        proxy_read_timeout    90s;
    }

    # ── /api/* → Spring Boot API (direct, no rewrite) ────────────────────────
    location /api/ {
        proxy_pass         http://tradepro-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        proxy_connect_timeout 90s;
        proxy_read_timeout    90s;
    }

    # ── /auth/* → Spring Boot (AuthController is at /auth not /api/auth) ─────
    location /auth/ {
        proxy_pass         http://tradepro-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        proxy_connect_timeout 90s;
        proxy_read_timeout    90s;
    }

    # ── Static assets — long-term cache ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — all other routes → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
