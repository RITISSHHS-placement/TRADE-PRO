<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradePro — Professional Trading Platform for India</title>
    <meta name="description" content="TradePro — Live NSE/BSE data, stock screener, portfolio analytics, mutual funds and digital gold. Free equity delivery." />
    <meta name="theme-color" content="#1a73e8" />
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var newUrl = p + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
